version: 2
project_name: system-stats

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./main.go
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # This section creates the platform-specific zips (Binary + Docs)
  - id: binary-packages
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

  # This section creates a single zip of the source code
  - id: source-code
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_source"
    files:
      - "**/*.go"
      - go.mod
      - go.sum
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'